[project]
name = "bq"
version = "0.1.0"
description = "Birthday Queue — jukebox colaborativo de festa"
requires-python = ">=3.13"

# Quatro dependências de runtime. Nenhuma com extensão C além do que vem no CPython.
# Ver .docs/03-arquitetura.md §2.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "mypy>=1.14"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

# Descoberta, não lista à mão. 🔴 A lista explícita era dívida garantida e de falha DIFERIDA: o
# finder do editable install mapeia só o pacote de topo, então um subpacote esquecido continuava
# importando em dev e no pytest, e sumia só do wheel — com exit code 0 em tudo.
[tool.setuptools.packages.find]
where = ["."]
include = ["bq*"]
namespaces = false  # exige __init__.py; senão __pycache__ entra como namespace package

[tool.setuptools.package-data]
# `*.sql` e não a lista nominal: `seeds.sql` não estava declarado e `db.py` o lê em TODO connect()
"bq.core" = ["*.sql"]

# RNF-24: mypy limpo nos módulos com aritmética de tempo e ordenação.
[tool.mypy]
python_version = "3.13"
files = ["bq"]
strict = false
warn_unused_ignores = true
# 🔴 Sem isto, um `overrides` que não casa módulo nenhum não avisa: o `strict` abaixo deixaria de
# valer em silêncio quando um módulo mudasse de caminho, e o exit code continuaria 0.
warn_unused_configs = true

[[tool.mypy.overrides]]
# `bq.play` entra aqui porque `heard_ms`, `remaining_ms` e `dispatch_next_at_mono` SÃO a
# aritmética de tempo que o RNF-24 protege — elas só mudaram de arquivo.
module = [
    "bq.core.clock",
    "bq.domain.play",
    "bq.domain.queue",
    "bq.votes",
    "bq.conductor",
]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
